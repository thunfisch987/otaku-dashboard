[install]

minimumReleaseAge = 259200 # 3 days in seconds

minimumReleaseAgeExcludes = [
	"@types/bun",
	"typescript",
	"@nuxt/image",
	"nuxt",
	"nitro",
	"@nuxt/ui",
	"vue",
	"zod",
	"@nuxt/kit",
]

[fmt]
tabWidth = 4
useTabs = true
semi = true
singleQuote = true
quoteProps = "as-needed"
trailingComma = "all"
bracketSpacing = true
arrowParens = "always"
bracketSameLine = false
singleAttributePerLine = true
printWidth = 80
sortPackageJson = false
ignorePatterns = [
	"convex/_generated/**",
	"convex/betterAuth/_generated/**",
	".agent/**",
]
